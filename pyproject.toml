[project]
name = "eml_reader_soso"
authors = [{name = "Leon Dionne", email = "ldionne@dridesign.sh.cn"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
dynamic = ["version", "description"]
dependencies = [
	"lxml",
	"PyQt5",
	"emlmailreader",
	"soso_qt_extras >= 1.9.0",
	"xdg_soso >= 1.1.0"
]

[project.urls]
Home = "https://github.com/Zen-Master-SoSo/eml_reader_soso"

[project.scripts]
eml-reader-soso = "eml_reader_soso.__main__:main"

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[bumpver]
current_version = "1.1.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = false
push = false

[bumpver.file_patterns]
"eml_reader_soso/__init__.py" = [
    '^__version__ = "{version}"$',
]
